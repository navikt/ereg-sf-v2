plugins {
    id 'application'

    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jmailen.kotlinter' version '5.7.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

group 'no.nav.ereg'
version '0.1'

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.ereg.BootstrapKt'
    }
}

shadowJar {
    archiveBaseName = 'app'
    archiveClassifier = ''
}

application {
    mainClass = 'no.nav.ereg.BootstrapKt'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "no.nav.security:token-validation-core:5.0.30"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    implementation "com.google.code.gson:gson:2.15.0"

    implementation "org.http4k:http4k-core:6.61.0.0"
    implementation "org.http4k:http4k-server-netty:6.61.0.0"
    implementation "org.http4k:http4k-client-okhttp:6.61.0.0"

    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.6.6"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"

    implementation "tools.jackson.core:jackson-databind:3.3.0" // Transitive dependency for net.logstash.logback:logstash-logback-encoder:9.0
    implementation "io.prometheus:simpleclient_common:0.16.0"
    implementation "io.prometheus:simpleclient_hotspot:0.16.0"

    implementation "com.auth0:java-jwt:4.6.2"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.87"

    implementation "org.postgresql:postgresql:42.7.14"

    implementation "org.jetbrains.exposed:exposed-core:0.61.0"
    implementation "org.jetbrains.exposed:exposed-dao:0.61.0"
    implementation "org.jetbrains.exposed:exposed-jdbc:0.61.0"
    implementation "org.jetbrains.exposed:exposed-java-time:0.61.0"

    implementation "com.zaxxer:HikariCP:5.1.0"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    test.kotlin.srcDirs += 'src/test/kotlin'
}

kotlin {
    jvmToolchain(21)
}

tasks.named('shadowJar') {
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.INCLUDE
    }
}

tasks.named('shadowJar') {
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.INCLUDE
    }
}
