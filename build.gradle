plugins {
    id 'application'

    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jmailen.kotlinter' version '5.2.0'
    id 'com.gradleup.shadow' version '8.3.1'
}

group 'no.nav.ereg'
version '0.1'

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.ereg.BootstrapKt'
    }
}

shadowJar {
    archiveBaseName = 'app'
    archiveClassifier = ''
}

application {
    mainClassName = 'no.nav.ereg.BootstrapKt'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "no.nav.security:token-validation-core:5.0.29"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

    implementation "com.google.code.gson:gson:2.13.2"

    implementation "org.http4k:http4k-core:6.57.2.0"
    implementation "org.http4k:http4k-server-netty:6.57.2.0"
    implementation "org.http4k:http4k-client-okhttp:6.57.2.0"

    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.5.34"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "tools.jackson.core:jackson-core:3.1.5" // Transitive to net.logstash.logback:logstash-logback-encoder
    implementation "tools.jackson.core:jackson-databind:3.1.5" // Transitive to net.logstash.logback:logstash-logback-encoder
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.1" // Transitive to tools.jackson.core:jackson-databind

    implementation "io.prometheus:simpleclient_common:0.9.0"
    implementation "io.prometheus:simpleclient_hotspot:0.9.0"

    implementation "com.auth0:java-jwt:4.6.0"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.85"

    implementation "org.postgresql:postgresql:42.7.12"

    implementation "org.jetbrains.exposed:exposed-core:0.46.0"
    implementation "org.jetbrains.exposed:exposed-dao:0.46.0"
    implementation "org.jetbrains.exposed:exposed-jdbc:0.46.0"
    implementation "org.jetbrains.exposed:exposed-java-time:0.46.0"

    implementation "com.zaxxer:HikariCP:3.4.1"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    test.kotlin.srcDirs += 'src/test/kotlin'
}

kotlin {
    jvmToolchain(21)
}