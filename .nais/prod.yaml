apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: ereg-sf-v2
  namespace: team-dialog
  labels:
    team: team-dialog
spec:
  image: "{{ image }}"
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/isAlive
  readiness:
    path: /internal/isReady
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 512Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-3840
        diskSize: 20
        diskAutoresize: true
        diskAutoresizeLimit: 40
        databases:
          - name: ereg
  ingresses:
    - "https://ereg-sf-v2.intern.nav.no"
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
       extra:
        - azp_name
        - NAVident
  accessPolicy:
    outbound:
      external:
        - host: data.brreg.no
        - host: login.salesforce.com
        - host: navdialog.my.salesforce.com
  envFrom:
    - configmap: salesforce-common
    - secret: ereg-sf
  env:
    - name: AN_ENV
      value: "a value in prod"